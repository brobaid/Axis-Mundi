name: CI

# CI is the sourcing gate. It runs on every push and must stay green on main.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The build must not reach the network. Astro's telemetry ping is the only
  # outbound call in the pipeline; turning it off keeps the runner hermetic and
  # removes a class of flake that never reproduces locally.
  ASTRO_TELEMETRY_DISABLED: '1'
  # Fonts are self-hosted through Fontsource as ordinary dependencies, so no
  # font is fetched at build time.
  DO_NOT_TRACK: '1'

jobs:
  check:
    name: validate, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Version comes from `packageManager` in package.json, so the runner and a
      # developer machine can never disagree about which pnpm built the lockfile.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Printed so any future divergence between a local machine and the runner
      # is visible in the log rather than inferred.
      - name: Toolchain
        run: |
          echo "node    $(node --version)"
          echo "pnpm    $(pnpm --version)"
          echo "declared $(node -p "require('./package.json').packageManager")"

      - name: Install
        run: pnpm install --frozen-lockfile

      # Zod-validates every content file, then checks the cross-file rules:
      # referential integrity and the Phase 0 sourcing rules (spec §9.2).
      - name: Validate content
        run: pnpm validate:content

      # tokens.css is the single source of every colour, and every contrast
      # contract must hold in BOTH modes (CLAUDE.md hard rule 1).
      - name: Audit design tokens
        run: pnpm validate:tokens

      # Layout invariants for the timeline canvas: density budget, rank gating,
      # nothing overlaps, branch tints step (spec §4, kickoff M1).
      - name: Check timeline invariants
        run: pnpm validate:timeline

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # Every internal href must resolve using the rules a plain static host
      # applies. `astro preview` rewrites extensionless paths to .html and
      # Vercel does not, so this is checked against dist/ rather than a server.
      - name: Check internal links
        run: pnpm validate:links
