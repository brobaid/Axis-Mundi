<!--
  Axis Mundi social card: the Brass Meridian standing over ten lanes.

  Like the favicon, a static asset cannot reference tokens.css, so the values
  below are the light-mode tokens verbatim — canvas #F7F3EC, surface #FDFBF7,
  ink #201B16, ink-soft #5C544A, hairline #E3DCD0, brass #9C7A2F, and the ten
  tradition hues in taxonomy order. If a token changes, change it here too.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#F7F3EC"/>
  <rect x="64" y="300" width="1072" height="266" fill="#FDFBF7" stroke="#E3DCD0"/>

  <!-- ten lanes, dots roughly where the collection's weight sits -->
  <g>
    <g fill="#2B6CB0"><circle cx="180" cy="326" r="4"/><circle cx="470" cy="326" r="5"/><circle cx="742" cy="326" r="4"/><circle cx="1010" cy="326" r="4"/></g>
    <g fill="#6B46A0"><circle cx="404" cy="352" r="6"/><circle cx="560" cy="352" r="4"/><circle cx="806" cy="352" r="5"/><circle cx="944" cy="352" r="4"/><circle cx="1060" cy="352" r="4"/></g>
    <g fill="#1E7A4C"><circle cx="600" cy="378" r="6"/><circle cx="700" cy="378" r="4"/><circle cx="880" cy="378" r="4"/><circle cx="1024" cy="378" r="4"/></g>
    <g fill="#D9740B"><circle cx="150" cy="404" r="5"/><circle cx="330" cy="404" r="4"/><circle cx="690" cy="404" r="4"/><circle cx="980" cy="404" r="4"/></g>
    <g fill="#8A3033"><circle cx="300" cy="430" r="5"/><circle cx="520" cy="430" r="4"/><circle cx="760" cy="430" r="4"/><circle cx="1000" cy="430" r="4"/></g>
    <g fill="#2F3B7A"><circle cx="900" cy="456" r="5"/><circle cx="1040" cy="456" r="4"/></g>
    <g fill="#C9A100"><circle cx="240" cy="482" r="5"/><circle cx="480" cy="482" r="4"/><circle cx="820" cy="482" r="4"/></g>
    <g fill="#D34E3A"><circle cx="640" cy="508" r="4"/><circle cx="870" cy="508" r="4"/><circle cx="1050" cy="508" r="4"/></g>
    <g fill="#147D77"><circle cx="280" cy="534" r="4"/><circle cx="660" cy="534" r="4"/><circle cx="990" cy="534" r="4"/></g>
    <g fill="#B3382C"><circle cx="200" cy="558" r="4"/><circle cx="560" cy="558" r="4"/><circle cx="930" cy="558" r="4"/></g>
  </g>

  <!-- the Brass Meridian -->
  <rect x="717" y="288" width="2" height="290" fill="#9C7A2F"/>
  <rect x="712" y="283" width="10" height="10" transform="rotate(45 717 288)" fill="#9C7A2F"/>

  <text x="64" y="150" font-family="Newsreader, Georgia, serif" font-size="76" fill="#201B16">Axis Mundi</text>
  <text x="64" y="200" font-family="Archivo, system-ui, sans-serif" font-size="21" letter-spacing="3" fill="#5C544A">THE LIVING MUSEUM</text>
  <text x="64" y="250" font-family="Source Serif 4, Georgia, serif" font-size="27" fill="#5C544A">Five thousand years of belief, on one line.</text>
</svg>
